# ============================================================================
# sync-upstream.yml — 上游同步 + 自动发布
#
# 机制(精简: 不走 git merge, 避免把上游 workflows/文档等无关文件带进本仓库),
# 由 scripts/sync-upstream.mjs 一站式完成:
#   ① 拉取上游 _worker.js(raw 直连, 失败自动切换 gh-proxy 镜像)
#   ② sha256 对比 → 有差异覆盖根文件, 无差异零改动
#   ③ 调 prepare-core.mjs 刷新运行时核心副本(worker-core.mjs / version.gen.ts,
#      副本内容稳定: 核心未变则不产生 git 变更, 不会误触发发布)
# 有变更 → commit + push → 以 job 级 uses 调用 pages-deploy.yml 发布
# (GitHub 仅允许 job 级调用可复用工作流; workflow_call 规避 GITHUB_TOKEN
# push 事件不触发其他工作流的递归限制)。
#
# 上游来源: 仓库 Variable UPSTREAM_REPO > deploy.config.js upstreamRepo >
#   默认 kentpan/edgetunnel; 分支: Variable UPSTREAM_BRANCH > main。
# ============================================================================

name: Sync Upstream & Deploy

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: '无上游更新也强制部署(false/true)'
        required: false
        default: 'false'
        type: string

permissions:
  contents: write
  deployments: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Sync _worker.js from upstream
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.commit.outputs.updated }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REPO: ${{ vars.UPSTREAM_REPO }}
          UPSTREAM_BRANCH: ${{ vars.UPSTREAM_BRANCH }}
        run: node scripts/sync-upstream.mjs

      - name: Commit & push
        id: commit
        run: |
          git config user.name "autotunnel-sync-bot"
          git config user.email "actions@github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "✓ 核心已与上游一致, 无需发布"
          else
            git add -A
            git commit -m "sync: 上游 _worker.js 更新 ($(date -u +'%F %T UTC'))"
            git push
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "✓ 上游更新已推送, 触发发布"
          fi

  deploy:
    name: Deploy to Cloudflare
    needs: sync
    if: needs.sync.outputs.updated == 'true' || inputs.force_deploy == 'true'
    uses: ./.github/workflows/pages-deploy.yml
    with:
      project_name: ''
    secrets: inherit
