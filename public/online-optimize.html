		<!doctype html>
		<html lang="zh-CN">

		<head>
			<meta charset="utf-8">
			<meta name="viewport" content="width=device-width, initial-scale=1">
			<title>BestCF</title>
			<style>
				:root {
					color-scheme: light;
					--bg: #f5f7fb;
					--panel: #ffffff;
					--panel-soft: #f9fbfd;
					--text: #172033;
					--muted: #667085;
					--line: #d9e0ea;
					--line-strong: #b8c4d6;
					--blue: #2563eb;
					--blue-dark: #1d4ed8;
					--green: #0f9f6e;
					--green-soft: #e8f7f0;
					--amber: #b7791f;
					--amber-soft: #fff7e6;
					--red: #c2413d;
					--red-soft: #fff0ef;
					--ink-soft: #eff4f9;
					--shadow: 0 18px 45px rgba(23, 32, 51, 0.08);
					--radius: 8px;
					--mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
					--sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				}

				* {
					box-sizing: border-box;
				}

				body {
					margin: 0;
					min-height: 100vh;
					background: var(--bg);
					color: var(--text);
					font-family: var(--sans);
					letter-spacing: 0;
				}

				button,
				input,
				select,
				textarea {
					font: inherit;
				}

				button {
					border: 0;
				}

				.shell {
					width: min(1440px, calc(100% - 32px));
					margin: 0 auto;
					padding: 28px 0 36px;
				}

				.topbar {
					display: flex;
					align-items: center;
					justify-content: space-between;
					gap: 16px;
					margin-bottom: 18px;
				}

				.brand {
					display: flex;
					align-items: center;
					gap: 12px;
					min-width: 0;
				}

				.brand-mark {
					display: grid;
					width: 42px;
					height: 42px;
					place-items: center;
					border: 1px solid #c9d7eb;
					border-radius: var(--radius);
					background: #ffffff;
					box-shadow: 0 8px 24px rgba(37, 99, 235, 0.12);
					color: var(--blue);
					flex: 0 0 auto;
				}

				.brand h1 {
					margin: 0;
					font-size: 24px;
					line-height: 1.15;
					font-weight: 760;
				}

				.brand small {
					display: block;
					margin-top: 4px;
					color: var(--muted);
					font-size: 13px;
				}

				.layout {
					display: grid;
					grid-template-columns: minmax(0, 1fr);
					gap: 18px;
					align-items: start;
				}

				.stack {
					display: grid;
					gap: 18px;
				}

				.panel {
					background: var(--panel);
					border: 1px solid var(--line);
					border-radius: var(--radius);
					box-shadow: var(--shadow);
					overflow: hidden;
				}

				.panel-head {
					display: flex;
					align-items: center;
					justify-content: space-between;
					gap: 12px;
					padding: 16px 18px;
					border-bottom: 1px solid var(--line);
					background: #ffffff;
				}

				.panel-title {
					margin: 0;
					font-size: 16px;
					font-weight: 740;
					line-height: 1.25;
				}

				.panel-body {
					padding: 18px;
				}

				.network-panel {
					display: grid;
					gap: 14px;
					padding: 16px;
					border: 1px solid var(--line);
					border-radius: var(--radius);
					background: var(--panel);
					box-shadow: var(--shadow);
				}

				.network-grid {
					display: grid;
					grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
					gap: 12px;
				}

				.network-item {
					position: relative;
					display: grid;
					grid-template-columns: auto minmax(0, 1fr) auto;
					align-items: center;
					gap: 12px;
					min-height: 82px;
					padding: 14px 14px 14px 18px;
					overflow: hidden;
					border: 1px solid var(--line);
					border-radius: var(--radius);
					background: var(--panel-soft);
				}

				.network-item::before {
					content: "";
					position: absolute;
					inset: 0 auto 0 0;
					width: 4px;
					background: #94a3b8;
				}

				.network-item.is-loading::before {
					background: var(--blue);
				}

				.network-item.is-ok {
					border-color: #b9e8d3;
					background: #f6fdf9;
				}

				.network-item.is-ok::before {
					background: var(--green);
				}

				.network-item.is-failed {
					border-color: #f2b8b5;
					background: #fff8f7;
				}

				.network-item.is-failed::before {
					background: var(--red);
				}

				.network-item.is-hidden {
					display: none;
				}

				.network-kind {
					display: grid;
					width: 58px;
					height: 38px;
					place-items: center;
					border-radius: var(--radius);
					background: #eef4ff;
					color: var(--blue);
					font-family: var(--mono);
					font-weight: 800;
					font-size: 14px;
				}

				.network-copy {
					display: grid;
					gap: 5px;
					min-width: 0;
				}

				.network-address {
					min-width: 0;
					overflow-wrap: anywhere;
					font-family: var(--mono);
					font-size: 15px;
					font-weight: 720;
					line-height: 1.35;
				}

				.network-note {
					min-width: 0;
					color: var(--muted);
					font-size: 12px;
					line-height: 1.35;
					overflow: hidden;
					text-overflow: ellipsis;
					white-space: nowrap;
				}

				.muted {
					color: var(--muted);
				}

				.tiny {
					font-size: 12px;
					line-height: 1.35;
				}

				.tag {
					display: inline-flex;
					align-items: center;
					min-height: 24px;
					padding: 3px 8px;
					border-radius: 999px;
					font-size: 12px;
					font-weight: 700;
					white-space: nowrap;
				}

				.tag.ok {
					color: #08734f;
					background: var(--green-soft);
				}

				.tag.warn {
					color: var(--amber);
					background: var(--amber-soft);
				}

				.tag.bad {
					color: var(--red);
					background: var(--red-soft);
				}

				.speed-retry-tag {
					cursor: pointer;
					transition: transform 0.15s ease, filter 0.15s ease;
				}

				.speed-retry-tag:hover,
				.speed-retry-tag:focus-visible {
					filter: brightness(0.96);
					transform: translateY(-1px);
				}

				.speed-retry-tag:focus-visible {
					outline: 2px solid rgba(239, 68, 68, 0.36);
					outline-offset: 2px;
				}

				.tag.idle {
					color: #475467;
					background: #eef2f6;
				}

				.notice {
					display: flex;
					align-items: center;
					gap: 10px;
					margin-top: 14px;
					padding: 11px 12px;
					border-radius: var(--radius);
					border: 1px solid var(--line);
					background: #f8fafc;
					color: var(--muted);
					line-height: 1.45;
				}

				.notice.ok {
					border-color: #b9e8d3;
					background: var(--green-soft);
					color: #08734f;
				}

				.notice.bad {
					border-color: #ffc9c5;
					background: var(--red-soft);
					color: var(--red);
				}

				.notice.warn {
					border-color: #ffe2a6;
					background: var(--amber-soft);
					color: var(--amber);
				}

				.form-grid {
					display: grid;
					grid-template-columns: repeat(2, minmax(0, 1fr));
					gap: 12px;
				}

				.form-grid.compact {
					grid-template-columns: repeat(4, minmax(0, 1fr));
				}

				.settings-block {
					margin-bottom: 16px;
				}

				.control-row+.advanced-settings {
					margin-top: 16px;
				}

				.advanced-settings {
					border: 1px solid var(--line);
					border-radius: var(--radius);
					background: #f8fafc;
				}

				.advanced-settings-summary {
					display: flex;
					align-items: center;
					justify-content: space-between;
					gap: 12px;
					min-height: 42px;
					padding: 10px 12px;
					cursor: pointer;
					list-style: none;
					user-select: none;
				}

				.advanced-settings-summary::-webkit-details-marker {
					display: none;
				}

				.advanced-settings-summary:hover {
					background: #eef4ff;
				}

				.advanced-settings-summary:focus-visible {
					outline: 2px solid rgba(37, 99, 235, 0.24);
					outline-offset: -2px;
				}

				.advanced-settings-copy {
					display: flex;
					align-items: baseline;
					flex: 1 1 auto;
					gap: 10px;
					min-width: 0;
				}

				.advanced-settings-title {
					color: #344054;
					font-size: 13px;
					font-weight: 760;
					white-space: nowrap;
				}

				.advanced-settings-meta {
					min-width: 0;
					overflow: hidden;
					color: var(--muted);
					font-size: 12px;
					font-weight: 400;
					text-overflow: ellipsis;
					white-space: nowrap;
				}

				.advanced-settings-chevron {
					width: 18px;
					height: 18px;
					color: var(--muted);
					fill: none;
					flex: 0 0 auto;
					stroke: currentColor;
					stroke-linecap: round;
					stroke-linejoin: round;
					stroke-width: 2;
					transition: transform 0.15s ease;
				}

				.advanced-settings[open] .advanced-settings-summary {
					border-bottom: 1px solid var(--line);
				}

				.advanced-settings[open] .advanced-settings-chevron {
					transform: rotate(180deg);
				}

				.advanced-settings-body {
					padding: 12px;
					background: #ffffff;
					border-radius: 0 0 var(--radius) var(--radius);
				}

				.field {
					display: grid;
					gap: 7px;
					min-width: 0;
				}

				.field label {
					color: #344054;
					font-size: 13px;
					font-weight: 720;
				}

				.label-row {
					display: flex;
					align-items: center;
					gap: 6px;
				}

				.help-tip {
					position: relative;
					display: inline-grid;
					width: 18px;
					height: 18px;
					place-items: center;
					border: 1px solid #d4a72c;
					border-radius: 50%;
					background: #fff8db;
					color: #8a6100;
					font-size: 12px;
					font-weight: 800;
					line-height: 1;
					cursor: help;
				}

				.help-tip::after {
					position: absolute;
					right: 50%;
					bottom: calc(100% + 9px);
					width: max-content;
					max-width: min(300px, 72vw);
					padding: 8px 10px;
					border: 1px solid #d8c073;
					border-radius: var(--radius);
					background: #fffdf2;
					box-shadow: 0 12px 28px rgba(23, 32, 51, 0.14);
					color: #5d4300;
					content: attr(data-tip);
					font-size: 12px;
					font-weight: 650;
					line-height: 1.45;
					opacity: 0;
					pointer-events: none;
					transform: translate(50%, 4px);
					transition: opacity 0.15s ease, transform 0.15s ease;
					z-index: 4;
					white-space: normal;
				}

				.help-tip::before {
					position: absolute;
					right: 50%;
					bottom: calc(100% + 4px);
					width: 9px;
					height: 9px;
					background: #fffdf2;
					border-right: 1px solid #d8c073;
					border-bottom: 1px solid #d8c073;
					content: "";
					opacity: 0;
					pointer-events: none;
					transform: translate(50%, 4px) rotate(45deg);
					transition: opacity 0.15s ease, transform 0.15s ease;
					z-index: 5;
				}

				.help-tip:hover::after,
				.help-tip:hover::before,
				.help-tip:focus::after,
				.help-tip:focus::before {
					opacity: 1;
					transform: translate(50%, 0) rotate(0deg);
				}

				.help-tip:hover::before,
				.help-tip:focus::before {
					transform: translate(50%, 0) rotate(45deg);
				}

				.control-row {
					display: grid;
					grid-template-columns: minmax(0, 1fr) auto auto;
					gap: 10px;
					align-items: end;
				}

				.input,
				.select {
					width: 100%;
					min-height: 42px;
					border: 1px solid var(--line-strong);
					border-radius: var(--radius);
					padding: 9px 11px;
					background: #ffffff;
					color: var(--text);
					outline: none;
				}

				.input:focus,
				.select:focus,
				textarea:focus {
					border-color: var(--blue);
					box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
				}

				.input:disabled,
				.select:disabled,
				button:disabled {
					cursor: not-allowed;
					opacity: 0.56;
				}

				.btn {
					display: inline-flex;
					align-items: center;
					justify-content: center;
					gap: 8px;
					min-height: 42px;
					padding: 9px 14px;
					border-radius: var(--radius);
					background: var(--blue);
					color: #ffffff;
					font-weight: 760;
					cursor: pointer;
					white-space: nowrap;
					transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
				}

				.btn:hover:not(:disabled) {
					background: var(--blue-dark);
					box-shadow: 0 10px 24px rgba(37, 99, 235, 0.18);
					transform: translateY(-1px);
				}

				.btn.secondary {
					border: 1px solid var(--line-strong);
					background: #ffffff;
					color: #25324a;
				}

				.btn.secondary:hover:not(:disabled) {
					background: #f8fafc;
					box-shadow: 0 10px 24px rgba(23, 32, 51, 0.08);
				}

				.btn.danger {
					background: var(--red);
				}

				.btn.danger:hover:not(:disabled) {
					background: #a83531;
					box-shadow: 0 10px 24px rgba(194, 65, 61, 0.16);
				}

				.btn.success {
					background: var(--green);
					color: #ffffff;
				}

				.btn.success:hover:not(:disabled) {
					background: #0b8159;
					box-shadow: 0 10px 24px rgba(15, 159, 110, 0.16);
				}

				#saveSelectedBtn.is-save-easter-shaking {
					animation: saveSelectedButtonShake 0.32s ease-in-out infinite;
					box-shadow: 0 0 0 4px rgba(15, 159, 110, 0.18), 0 14px 30px rgba(15, 159, 110, 0.24);
					transform-origin: center;
				}

				#saveSelectedBtn.is-save-locked {
					cursor: not-allowed;
					opacity: 0.56;
				}

				#saveSelectedBtn.is-save-locked:not(.is-save-easter-shaking):hover {
					background: var(--green);
					box-shadow: none;
					transform: none;
				}

				@keyframes saveSelectedButtonShake {

					0%,
					100% {
						transform: translateX(0) rotate(0deg);
					}

					20% {
						transform: translateX(-2px) rotate(-2deg);
					}

					40% {
						transform: translateX(2px) rotate(2deg);
					}

					60% {
						transform: translateX(-2px) rotate(-1.5deg);
					}

					80% {
						transform: translateX(2px) rotate(1.5deg);
					}
				}

				.icon-btn {
					display: inline-grid;
					width: 38px;
					height: 38px;
					place-items: center;
					border: 1px solid var(--line);
					border-radius: var(--radius);
					background: #ffffff;
					color: #344054;
					cursor: pointer;
				}

				.icon-btn:hover:not(:disabled) {
					background: #f3f6fa;
				}

				.icon {
					width: 18px;
					height: 18px;
					flex: 0 0 auto;
					stroke: currentColor;
					stroke-width: 2;
					stroke-linecap: round;
					stroke-linejoin: round;
					fill: none;
				}

				.editor {
					margin-top: 16px;
					border: 1px solid var(--line-strong);
					border-radius: var(--radius);
					overflow: hidden;
					background: #ffffff;
				}

				.editor-bar {
					display: flex;
					align-items: center;
					justify-content: space-between;
					gap: 10px;
					min-height: 44px;
					padding: 6px 8px 6px 12px;
					border-bottom: 1px solid var(--line);
					background: #f8fafc;
				}

				.editor-count {
					font-family: var(--mono);
					font-size: 13px;
					color: #475467;
				}

				.editor-body {
					display: grid;
					grid-template-columns: 58px minmax(0, 1fr);
					height: 376px;
					min-height: 0;
					overflow: hidden;
					background: #ffffff;
				}

				.line-gutter {
					height: 100%;
					overflow: hidden;
					border-right: 1px solid var(--line);
					background: #eef2f6;
					color: #667085;
					font-family: var(--mono);
					font-size: 13px;
					line-height: 22px;
					text-align: right;
					user-select: none;
					position: relative;
				}

				.line-gutter pre {
					position: absolute;
					top: 0;
					right: 0;
					left: 0;
					margin: 0;
					padding: 12px 10px 12px 4px;
					font: inherit;
					line-height: inherit;
					white-space: pre;
					will-change: transform;
				}

				.textarea-wrap {
					position: relative;
					min-width: 0;
					height: 100%;
					overflow: hidden;
					background: #ffffff;
				}

				.line-shades {
					position: absolute;
					inset: 0;
					padding: 12px 0;
					pointer-events: none;
					will-change: transform;
					z-index: 0;
				}

				.shade-line {
					height: 22px;
				}

				.shade-line:nth-child(odd) {
					background: #ffffff;
				}

				.shade-line:nth-child(even) {
					background: #f8fafc;
				}

				textarea {
					display: block;
					position: relative;
					z-index: 1;
					width: 100%;
					height: 100%;
					min-height: 0;
					resize: none;
					border: 0;
					padding: 12px 12px;
					color: #111827;
					background: transparent;
					font-family: var(--mono);
					font-size: 13px;
					line-height: 22px;
					outline: none;
					white-space: pre;
					overflow: auto;
				}

				.actions {
					display: flex;
					flex-wrap: wrap;
					gap: 10px;
					align-items: center;
					margin-top: 16px;
				}

				.progress {
					display: grid;
					gap: 7px;
					margin-top: 14px;
				}

				.progress-meta {
					display: flex;
					align-items: center;
					justify-content: space-between;
					gap: 12px;
				}

				.progress-meta #latencyStatus {
					min-width: 0;
					overflow-wrap: anywhere;
				}

				.progress-meta #progressText {
					flex: 0 0 auto;
					font-family: var(--mono);
					white-space: nowrap;
				}

				.progress-line {
					height: 9px;
					overflow: hidden;
					border-radius: 999px;
					background: #e7edf5;
				}

				.progress-bar {
					width: 0;
					height: 100%;
					border-radius: inherit;
					background: linear-gradient(90deg, #2563eb, #0f9f6e);
					transition: width 0.2s ease;
				}

				.result-wrap {
					max-height: 731px;
					overflow: auto;
				}

				table {
					width: 100%;
					min-width: 860px;
					border-collapse: collapse;
					table-layout: fixed;
				}

				th,
				td {
					padding: 12px 10px;
					border-bottom: 1px solid var(--line);
					text-align: left;
					vertical-align: middle;
					overflow-wrap: anywhere;
				}

				th {
					background: #f8fafc;
					color: #344054;
					font-size: 13px;
					font-weight: 780;
					height: 43px;
					position: sticky;
					top: 0;
					z-index: 1;
				}

				td {
					font-size: 13px;
					height: 43px;
				}

				.selection-cell {
					width: 46px;
					text-align: center;
				}

				.selection-cell input {
					width: 16px;
					height: 16px;
					margin: 0;
					cursor: pointer;
					accent-color: var(--green);
				}

				.result-row {
					cursor: pointer;
				}

				body.is-result-dragging,
				body.is-result-dragging * {
					user-select: none;
				}

				.result-row:hover td {
					background: #f3f8f6;
				}

				.result-row.is-selected td {
					background: var(--green-soft);
				}

				.result-row.is-selected:hover td {
					background: #d7f0e4;
				}

				.sort-header {
					display: inline-flex;
					align-items: center;
					justify-content: flex-start;
					gap: 6px;
					width: 100%;
					min-height: 20px;
					padding: 0;
					background: transparent;
					color: inherit;
					cursor: pointer;
					font-weight: inherit;
					text-align: left;
				}

				.sort-header:hover {
					color: var(--blue);
				}

				.sort-mark {
					min-width: 12px;
					color: var(--blue);
					font-size: 11px;
					line-height: 1;
				}

				.filterable-header {
					position: sticky;
				}

				.filter-header-label {
					display: inline-flex;
					align-items: center;
					gap: 4px;
					min-width: 0;
					padding: 2px 0;
					border: 0;
					background: transparent;
					color: inherit;
					cursor: pointer;
					font: inherit;
					font-weight: inherit;
					text-align: left;
				}

				.filter-header-label:hover,
				.filter-header-label.is-active {
					color: var(--blue);
				}

				.filter-header-label.is-filtered::after {
					color: var(--green);
					content: "●";
					font-size: 8px;
					line-height: 1;
				}

				.result-filter-menu {
					position: fixed;
					z-index: 70;
					width: min(260px, calc(100vw - 24px));
					max-height: min(360px, calc(100vh - 32px));
					display: grid;
					grid-template-rows: auto minmax(0, 1fr);
					border: 1px solid var(--line);
					border-radius: var(--radius);
					background: #ffffff;
					box-shadow: 0 18px 42px rgba(15, 23, 42, 0.18);
					color: var(--text);
					overflow: hidden;
				}

				.result-filter-actions {
					display: flex;
					gap: 8px;
					padding: 10px;
					border-bottom: 1px solid var(--line);
					background: #f8fafc;
				}

				.result-filter-action {
					flex: 1;
					min-width: 0;
					padding: 6px 8px;
					border: 1px solid var(--line);
					border-radius: 6px;
					background: #ffffff;
					color: #344054;
					cursor: pointer;
					font-size: 12px;
					font-weight: 760;
				}

				.result-filter-action:hover {
					border-color: var(--blue);
					color: var(--blue);
				}

				.result-filter-options {
					overflow: auto;
					overscroll-behavior: contain;
					padding: 6px;
				}

				.result-filter-option {
					display: flex;
					align-items: center;
					gap: 8px;
					min-height: 30px;
					padding: 6px 7px;
					border-radius: 6px;
					cursor: pointer;
					font-size: 13px;
					line-height: 1.35;
				}

				.result-filter-option:hover {
					background: #f3f8f6;
				}

				.result-filter-option input {
					width: 15px;
					height: 15px;
					flex: 0 0 auto;
					margin: 0;
					accent-color: var(--green);
				}

				.result-filter-option-text {
					min-width: 0;
					overflow: hidden;
					text-overflow: ellipsis;
					white-space: nowrap;
				}

				.result-filter-option-count {
					flex: 0 0 auto;
					margin-left: auto;
					color: var(--muted);
					font-size: 12px;
					font-weight: 700;
					white-space: nowrap;
				}

				.result-filter-option .country-cell {
					min-width: 0;
				}

				td.ip-cell {
					font-family: var(--mono);
				}

				.copy-address-btn {
					display: inline;
					padding: 0;
					border: 0;
					background: transparent;
					color: var(--blue);
					cursor: pointer;
					font: inherit;
					text-align: left;
					overflow-wrap: anywhere;
				}

				.copy-address-btn:hover,
				.copy-address-btn:focus {
					color: var(--blue-dark);
					text-decoration: underline;
				}

				.copy-address-tip {
					position: fixed;
					z-index: 60;
					max-width: min(240px, calc(100vw - 24px));
					padding: 7px 10px;
					border: 1px solid #b9e8d3;
					border-radius: var(--radius);
					background: var(--green);
					box-shadow: 0 12px 28px rgba(15, 159, 110, 0.22);
					color: #ffffff;
					font-size: 12px;
					font-weight: 760;
					line-height: 1.35;
					pointer-events: none;
					transform: translate(-50%, -100%) translateY(-8px);
					animation: copyAddressTip 1.45s ease forwards;
					white-space: nowrap;
				}

				.optimize-toast {
					position: fixed;
					top: 18px;
					right: 18px;
					z-index: 80;
					width: min(360px, calc(100vw - 36px));
					padding: 12px 14px;
					border: 1px solid #fecaca;
					border-radius: var(--radius);
					background: #fff5f5;
					box-shadow: 0 18px 40px rgba(127, 29, 29, 0.16);
					color: #7f1d1d;
					font-size: 13px;
					font-weight: 720;
					line-height: 1.55;
					opacity: 0;
					pointer-events: none;
					transform: translate3d(0, -8px, 0);
					transition: opacity 0.18s ease, transform 0.18s ease;
				}

				.optimize-toast.is-visible {
					opacity: 1;
					transform: translate3d(0, 0, 0);
				}

				@keyframes copyAddressTip {
					0% {
						opacity: 0;
						transform: translate(-50%, -100%) translateY(0);
					}

					15%,
					78% {
						opacity: 1;
						transform: translate(-50%, -100%) translateY(-8px);
					}

					100% {
						opacity: 0;
						transform: translate(-50%, -100%) translateY(-14px);
					}
				}

				.country-cell {
					display: inline-flex;
					align-items: center;
					gap: 6px;
					min-width: 0;
					max-width: 100%;
				}

				.country-flag {
					width: 20px;
					height: 14px;
					flex: 0 0 auto;
					border-radius: 2px;
					box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.14);
					object-fit: cover;
					background: #ffffff;
				}

				.country-code {
					min-width: 0;
					overflow: hidden;
					text-overflow: ellipsis;
					white-space: nowrap;
				}

				.empty {
					padding: 26px 12px;
					color: var(--muted);
					text-align: center;
				}

				.link-btn {
					padding: 0;
					background: transparent;
					color: var(--blue);
					cursor: pointer;
					font-weight: 760;
				}

				.speed-test-btn {
					display: inline-flex;
					align-items: center;
					gap: 4px;
				}

				.speed-test-btn.is-speed-batch-target {
					position: relative;
					color: var(--blue-dark);
					text-decoration: none;
					animation: speedBatchTargetPulse 0.9s ease-in-out infinite alternate;
				}

				.speed-test-btn.is-speed-batch-target::after {
					content: "";
					position: absolute;
					inset: -4px -6px;
					border-radius: 10px;
					border: 1px solid rgba(59, 130, 246, 0.42);
					background: rgba(59, 130, 246, 0.08);
					box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.08), 0 8px 18px rgba(59, 130, 246, 0.12);
					pointer-events: none;
				}

				.speed-test-btn.is-speed-batch-target>* {
					position: relative;
					z-index: 1;
				}

				.speed-test-btn.is-speed-pending {
					color: var(--blue-dark);
					cursor: default;
					text-decoration: none;
					animation: speedBatchPendingPulse 1.1s ease-in-out infinite alternate;
				}

				.speed-test-btn.is-speed-pending .icon {
					animation: speedBatchPendingIcon 1.1s ease-in-out infinite;
				}

				@keyframes speedBatchTargetPulse {
					from {
						transform: translateY(0) scale(1);
					}

					to {
						transform: translateY(-1px) scale(1.03);
					}
				}

				@keyframes speedBatchPendingPulse {
					from {
						opacity: 0.82;
					}

					to {
						opacity: 1;
					}
				}

				@keyframes speedBatchPendingIcon {
					from {
						transform: translateY(0);
					}

					50% {
						transform: translateY(-1px);
					}

					to {
						transform: translateY(0);
					}
				}

				.speed-test-btn .icon {
					width: 14px;
					height: 14px;
				}

				.link-btn:hover:not(:disabled) {
					color: var(--blue-dark);
					text-decoration: underline;
				}

				.result-footer {
					display: flex;
					align-items: center;
					justify-content: space-between;
					gap: 12px;
					padding: 14px 18px;
					border-top: 1px solid var(--line);
					background: #ffffff;
				}

				.result-actions {
					display: flex;
					align-items: center;
					justify-content: space-between;
					gap: 12px;
					padding: 14px 18px;
					border-top: 1px solid var(--line);
					background: #ffffff;
				}

				.result-actions-group {
					display: flex;
					flex-wrap: wrap;
					align-items: center;
					gap: 10px;
				}

				.bestcf-credit {
					margin-top: 18px;
					color: var(--muted);
					font-size: 12px;
					line-height: 1.6;
					text-align: center;
					overflow-wrap: anywhere;
				}

				.bestcf-credit a {
					color: var(--blue);
					text-decoration: none;
				}

				.bestcf-credit a:hover {
					text-decoration: underline;
				}

				.selection-status {
					min-width: 72px;
					text-align: right;
				}

				/* ==================== 开屏加载动画 ==================== */
				.boot-loading {
					position: fixed;
					inset: 0;
					z-index: 90;
					display: flex;
					align-items: center;
					justify-content: center;
					padding: 18px;
					background: var(--bg);
					transition: opacity 0.5s ease 0.08s, visibility 0.5s ease 0.08s;
				}

				.boot-loading.is-hidden {
					opacity: 0;
					visibility: hidden;
					pointer-events: none;
				}

				.boot-loading.is-hidden .boot-loading-card {
					opacity: 0;
					transform: translateY(-10px) scale(0.98);
				}

				.boot-loading-card {
					display: grid;
					justify-items: center;
					gap: 14px;
					padding: 30px 36px;
					border: 1px solid var(--line);
					border-radius: var(--radius);
					background: var(--panel);
					box-shadow: var(--shadow);
					transition: opacity 0.4s ease, transform 0.4s ease;
				}

				.boot-loading-brand {
					color: var(--text);
					font-size: 24px;
					font-weight: 800;
					letter-spacing: 0.5px;
				}

				.boot-loading-status {
					color: var(--muted);
					font-size: 13px;
					font-weight: 650;
				}

				.boot-loading-track {
					width: min(260px, 70vw);
					height: 8px;
					overflow: hidden;
					border-radius: 999px;
					background: var(--ink-soft);
				}

				.boot-loading-bar {
					width: 0;
					height: 100%;
					border-radius: inherit;
					background: linear-gradient(90deg, var(--blue), var(--green));
					transition: width 0.45s cubic-bezier(0.22, 0.61, 0.36, 1);
				}

				.boot-loading-bar.is-crawling {
					transition-duration: 5s;
				}

				.network-warning-overlay {
					position: fixed;
					inset: 0;
					z-index: 50;
					display: none;
					align-items: center;
					justify-content: center;
					padding: 18px;
					background: rgba(0, 0, 0, 0.72);
					backdrop-filter: blur(3px);
				}

				.network-warning-overlay.is-visible {
					display: flex;
				}

				.network-warning-modal {
					width: min(620px, 100%);
					border: 3px solid #ffffff;
					border-radius: var(--radius);
					background: #dc2626;
					box-shadow: 0 28px 80px rgba(127, 29, 29, 0.72), 0 0 0 8px rgba(220, 38, 38, 0.24);
					color: #ffffff;
					overflow: hidden;
					animation: networkWarningPop 0.18s ease-out;
				}

				.network-warning-modal.is-request-failed {
					background: #b7791f;
					box-shadow: 0 28px 80px rgba(92, 54, 9, 0.62), 0 0 0 8px rgba(183, 121, 31, 0.22);
				}

				.network-warning-body {
					display: grid;
					gap: 12px;
					padding: 24px 24px 18px;
					line-height: 1.55;
					font-size: 15px;
					font-weight: 650;
				}

				.network-warning-heading {
					display: flex;
					align-items: center;
					gap: 10px;
					font-size: 25px;
					line-height: 1.25;
					font-weight: 900;
					letter-spacing: 0;
					text-shadow: 0 1px 2px rgba(0, 0, 0, 0.28);
				}

				.network-warning-heading::before,
				.network-warning-heading::after {
					content: "";
					flex: 1;
					height: 2px;
					background: rgba(255, 255, 255, 0.72);
				}

				.network-warning-title {
					font-size: 18px;
					font-weight: 850;
				}

				.network-warning-message {
					color: rgba(255, 255, 255, 0.92);
					font-weight: 680;
					white-space: pre-line;
				}

				.network-warning-summary {
					display: grid;
					gap: 8px;
					margin-top: 2px;
				}

				.network-warning-row {
					display: grid;
					grid-template-columns: 60px minmax(0, 1fr) auto;
					align-items: center;
					gap: 10px;
					min-height: 38px;
					padding: 8px 10px;
					border: 1px solid rgba(255, 255, 255, 0.28);
					border-radius: var(--radius);
					background: rgba(255, 255, 255, 0.12);
				}

				.network-warning-family {
					font-family: var(--mono);
					font-weight: 850;
				}

				.network-warning-ip {
					min-width: 0;
					overflow-wrap: anywhere;
					font-family: var(--mono);
					font-weight: 760;
				}

				.network-warning-country {
					padding: 2px 7px;
					border-radius: 999px;
					background: rgba(255, 255, 255, 0.18);
					font-family: var(--mono);
					font-size: 12px;
					font-weight: 850;
					white-space: nowrap;
				}

				.network-warning-details {
					margin-top: 2px;
					border: 1px solid rgba(255, 255, 255, 0.28);
					border-radius: var(--radius);
					background: rgba(127, 29, 29, 0.24);
					overflow: hidden;
				}

				.network-warning-details[hidden] {
					display: none;
				}

				.network-warning-details summary {
					padding: 9px 11px;
					cursor: pointer;
					font-weight: 800;
				}

				.network-warning-json {
					max-height: 260px;
					margin: 0;
					padding: 11px;
					overflow: auto;
					border-top: 1px solid rgba(255, 255, 255, 0.22);
					background: rgba(15, 23, 42, 0.54);
					color: #ffffff;
					font-family: var(--mono);
					font-size: 12px;
					line-height: 1.55;
					white-space: pre-wrap;
				}

				.network-warning-actions {
					display: flex;
					justify-content: flex-end;
					gap: 12px;
					padding: 0 24px 24px;
				}

				.network-warning-actions .btn {
					min-width: 120px;
					border: 2px solid #ffffff;
					background: #ffffff;
					color: #b91c1c;
					box-shadow: 0 12px 28px rgba(127, 29, 29, 0.28);
					font-size: 16px;
					font-weight: 900;
				}

				.network-warning-modal.is-request-failed .network-warning-actions .btn {
					color: #8a4d0f;
				}

				.network-warning-actions .btn:hover:not(:disabled) {
					background: #fff1f2;
					color: #7f1d1d;
					box-shadow: 0 16px 36px rgba(127, 29, 29, 0.36);
				}

				.network-warning-modal.is-request-failed .network-warning-actions .btn:hover:not(:disabled) {
					background: #fff7e6;
					color: #6f3d0a;
					box-shadow: 0 16px 36px rgba(92, 54, 9, 0.32);
				}

				/* 本地优选（推荐）按钮：绿色渐变实心，突出引导前往 */
				.network-warning-actions .btn-local-warning {
					background: linear-gradient(135deg, #10b981 0, #059669 100%);
					color: #ffffff;
					border-color: rgba(255, 255, 255, 0.9);
					box-shadow: 0 12px 28px rgba(6, 95, 70, 0.5), 0 0 0 4px rgba(16, 185, 129, 0.26);
				}

				.network-warning-modal.is-request-failed .network-warning-actions .btn-local-warning {
					color: #ffffff;
				}

				.network-warning-actions .btn-local-warning:hover:not(:disabled) {
					background: linear-gradient(135deg, #34d399 0, #10b981 100%);
					color: #ffffff;
					border-color: #ffffff;
					box-shadow: 0 16px 36px rgba(6, 95, 70, 0.6), 0 0 0 4px rgba(16, 185, 129, 0.36);
					transform: translateY(-1px);
				}

				.network-warning-modal.is-request-failed .network-warning-actions .btn-local-warning:hover:not(:disabled) {
					background: linear-gradient(135deg, #34d399 0, #10b981 100%);
					color: #ffffff;
					box-shadow: 0 16px 36px rgba(6, 95, 70, 0.6), 0 0 0 4px rgba(16, 185, 129, 0.36);
				}

				@keyframes networkWarningPop {
					0% {
						opacity: 0;
						transform: scale(0.96);
					}

					100% {
						opacity: 1;
						transform: scale(1);
					}
				}

				.kbd-row {
					display: flex;
					flex-wrap: wrap;
					gap: 8px;
					margin-top: 12px;
				}

				.pill {
					display: inline-flex;
					align-items: center;
					min-height: 26px;
					padding: 4px 8px;
					border: 1px solid var(--line);
					border-radius: 999px;
					background: #ffffff;
					color: #475467;
					font-family: var(--mono);
					font-size: 12px;
				}

				html.dark-mode {
					color-scheme: dark;
					--bg: #0f172a;
					--panel: #111827;
					--panel-soft: #182235;
					--text: #e5e7eb;
					--muted: #9ca3af;
					--line: #263247;
					--line-strong: #3a475c;
					--blue: #60a5fa;
					--blue-dark: #3b82f6;
					--green: #34d399;
					--green-soft: rgba(52, 211, 153, 0.16);
					--amber: #fbbf24;
					--amber-soft: rgba(251, 191, 36, 0.16);
					--red: #f87171;
					--red-soft: rgba(248, 113, 113, 0.15);
					--ink-soft: #1f2937;
					--shadow: 0 18px 45px rgba(0, 0, 0, 0.28);
				}

				html.dark-mode body,
				html.dark-mode .panel,
				html.dark-mode .panel-head,
				html.dark-mode .panel-body,
				html.dark-mode .result-footer,
				html.dark-mode .result-actions,
				html.dark-mode .textarea-wrap,
				html.dark-mode .editor,
				html.dark-mode .icon-btn,
				html.dark-mode .btn.secondary,
				html.dark-mode .pill {
					background: var(--panel);
					color: var(--text);
				}

				html.dark-mode .network-item,
				html.dark-mode .editor-bar,
				html.dark-mode .advanced-settings,
				html.dark-mode th,
				html.dark-mode .line-gutter,
				html.dark-mode .shade-line:nth-child(even),
				html.dark-mode .notice,
				html.dark-mode .tag.idle {
					background: var(--panel-soft);
					color: var(--muted);
				}

				html.dark-mode .network-item.is-ok {
					border-color: rgba(52, 211, 153, 0.36);
					background: rgba(52, 211, 153, 0.08);
				}

				html.dark-mode .network-item.is-failed {
					border-color: rgba(248, 113, 113, 0.36);
					background: rgba(248, 113, 113, 0.08);
				}

				html.dark-mode .shade-line:nth-child(odd) {
					background: #0f172a;
				}

				html.dark-mode .shade-line:nth-child(even) {
					background: #182235;
				}

				html.dark-mode .brand-mark,
				html.dark-mode .network-kind,
				html.dark-mode .input,
				html.dark-mode .select,
				html.dark-mode textarea {
					background: #0b1220;
					color: var(--text);
					border-color: var(--line-strong);
				}

				html.dark-mode .textarea-wrap textarea {
					background: transparent;
				}

				html.dark-mode .optimize-toast {
					border-color: rgba(248, 113, 113, 0.38);
					background: #2a1216;
					box-shadow: 0 18px 40px rgba(0, 0, 0, 0.34);
					color: #fecaca;
				}

				html.dark-mode .tag.ok {
					color: #8ff0c2;
					background: rgba(52, 211, 153, 0.16);
				}

				html.dark-mode .tag.warn {
					color: #fde68a;
					background: rgba(251, 191, 36, 0.16);
				}

				html.dark-mode .tag.bad {
					color: #fecaca;
					background: rgba(248, 113, 113, 0.16);
				}

				html.dark-mode .help-tip {
					border-color: #85670f;
					background: #29230f;
					color: #fde68a;
				}

				html.dark-mode .help-tip::after,
				html.dark-mode .help-tip::before {
					border-color: #85670f;
					background: #29230f;
					color: #fde68a;
				}

				html.dark-mode .network-warning-overlay {
					background: rgba(0, 0, 0, 0.78);
				}

				html.dark-mode .network-warning-modal {
					border-color: #ffffff;
					background: #b91c1c;
					color: #ffffff;
					box-shadow: 0 28px 80px rgba(0, 0, 0, 0.65), 0 0 0 8px rgba(248, 113, 113, 0.18);
				}

				html.dark-mode .network-warning-modal.is-request-failed {
					background: #92400e;
					box-shadow: 0 28px 80px rgba(0, 0, 0, 0.65), 0 0 0 8px rgba(251, 191, 36, 0.16);
				}

				html.dark-mode .advanced-settings-body {
					background: var(--panel);

				// ==================== 开屏加载动画 ====================

				const BOOT_LOADING_MIN_VISIBLE = 800;
				const bootLoading = {
					active: true,
					startedAt: performance.now(),
					timers: []
				};

				function scheduleBootLoadingProgress() {
					const bar = document.getElementById("bootLoadingBar");
					if (!bar) return;
					[
						{ delay: 60, width: "30%" },
						{ delay: 700, width: "60%" },
						{ delay: 1600, width: "80%" },
						{ delay: 2600, width: "90%" },
						{ delay: 3000, width: "98%", crawl: true }
					].forEach(({ delay, width, crawl }) => {
						bootLoading.timers.push(window.setTimeout(() => {
							if (crawl) bar.classList.add("is-crawling");
							bar.style.width = width;
						}, delay));
					});
				}

				function finishBootLoading() {
					// 冲刺 100%（先退出慢速蠕动）→ 分层淡出（卡片先行、背景随后）→ resolve 后由调用方弹警告/放行
					const overlay = document.getElementById("bootLoading");
					const bar = document.getElementById("bootLoadingBar");
					bootLoading.timers.forEach((timer) => window.clearTimeout(timer));
					bootLoading.timers = [];
					const wait = Math.max(0, BOOT_LOADING_MIN_VISIBLE - (performance.now() - bootLoading.startedAt));
					return new Promise((resolve) => {
						window.setTimeout(() => {
							if (bar) {
								bar.classList.remove("is-crawling");
								bar.style.width = "100%";
							}
							window.setTimeout(() => {
								if (overlay) overlay.classList.add("is-hidden");
								bootLoading.active = false;
								window.setTimeout(resolve, 580);
							}, 320);
						}, wait);
					});
				}

				async function detectNetwork() {
					return refreshCnNetwork({ resetResults: true, stopRuns: true });
				}

				async function ensureCnNetworkBeforeAction({ button, statusEl, idleHtml }) {
					if (state.networkChecking) return false;
					if (button) button.innerHTML = `${svgPulseIcon()}网络验证`;
					if (statusEl) statusEl.textContent = "正在检测CN网络";
					const allowed = await refreshCnNetwork({ resetResults: false, stopRuns: false });
					if (!allowed) {
						if (button && idleHtml) button.innerHTML = idleHtml;
						if (statusEl) statusEl.textContent = "检测未通过，请关闭代理后重试";
						return false;
					}
					if (statusEl) statusEl.textContent = "CN网络检测通过";
					return true;
				}

				async function refreshCnNetwork({ resetResults = false, stopRuns = false } = {}) {
					if (state.networkChecking) return availableFamilies().length > 0;
					state.networkChecking = true;
					rememberSelectedLibrary();

					if (stopRuns) {
						if (state.latencyRun) stopLatencyRun();
						if (state.speedRun) stopSpeedRun();
					}

					state.ipv4 = null;
					state.ipv6 = null;
					state.network = { ipv4: null, ipv6: null };
					state.locations = [];
					state.locationsByIata = new Map();
					if (resetResults) {
						state.results = [];
						state.selectedIds.clear();
						state.nextResultId = 1;
						resetResultFilters();
						renderResults();
						setProgress(0, 0);
					}

					renderNetworkCard("ipv4", { status: "loading" });
					renderNetworkCard("ipv6", { status: "loading" });
					updateLibraryOptions();
					updateActionAvailability();

					try {
						const bestHost = await resolveBestHost();
						const checks = await Promise.allSettled([
							detectStack("ipv4", bestHost),
							detectStack("ipv6", bestHost)
						]);

						checks.forEach((result, index) => {
							const family = index === 0 ? "ipv4" : "ipv6";
							if (result.status === "fulfilled") {
								state.network[family] = result.value;
								if (result.value.allowed) {
									if (result.value.ipType === "ipv4") state.ipv4 = result.value.ip;
									if (result.value.ipType === "ipv6") state.ipv6 = result.value.ip;
								}
							} else {
								state.network[family] = {
									status: "failed",
									error: result.reason && result.reason.message ? result.reason.message : "不具备优选条件"
								};
							}
						});

						renderNetworkCard("ipv4", state.network.ipv4);
						renderNetworkCard("ipv6", state.network.ipv6);
						updateLibraryOptions();
						await loadLocations();
						updateServiceStatus();

						const allowed = availableFamilies().length > 0;
						if (bootLoading.active) {
							await finishBootLoading();
						}
						if (!allowed) showNetworkWarning();
						return allowed;
					} catch (error) {
						if (bootLoading.active) await finishBootLoading();
						throw error;
					} finally {
						state.networkChecking = false;
						updateActionAvailability();
					}
				}

				function showNetworkWarning() {
					renderNetworkWarning(buildNetworkWarningContext());
					els.networkWarningOverlay.classList.add("is-visible");
					els.networkWarningConfirmBtn.focus();
				}

				function buildNetworkWarningContext() {
					const entries = ["ipv4", "ipv6"].map((family) => ({
						family,
						info: state.network[family]
					}));
					const completed = entries.filter(({ info }) => info && info.status === "done");
					const nonCn = completed.filter(({ info }) => !info.allowed);

				if (nonCn.length) {
					return {
						kind: "non-cn",
						heading: "红牌警告",
						title: "检测到当前网络出口不是 CN 直连",
						message: "请确认浏览器当前网络是否经过了 代理、VPN 或 境外网络，\n在线优选仅有 CN 直连网络环境才可以实现！\n当前网络环境无法进行在线优选，可尝试使用「本地优选」。",
						rows: nonCn,
						details: completed
					};
				}

				return {
					kind: "request-failed",
					heading: "黄牌警告",
					title: "优选域名请求失败",
					message: "当前网络环境无法进行在线优选，但可尝试使用「本地优选」。\n请自行检查网络环境，确保优选域名可访问。",
					rows: entries,
					details: completed
				};
				}

				function renderNetworkWarning(context) {
					els.networkWarningModal.classList.toggle("is-request-failed", context.kind === "request-failed");
					els.networkWarningHeading.textContent = context.heading;
					els.networkWarningTitle.textContent = context.title;
					els.networkWarningMessage.textContent = context.message;
					els.networkWarningSummary.innerHTML = context.rows.map(({ family, info }) => {
						if (context.kind === "non-cn") return renderNetworkWarningNonCnRow(family, info);
						return renderNetworkWarningFailedRow(family, info);
					}).join("");

					const detailPayload = context.details
						.filter(({ info }) => info && info.raw)
						.map(({ family, info }) => ({
							family,
							endpoint: info.endpoint || "",
							response: info.raw
						}));
					if (detailPayload.length) {
						els.networkWarningJson.textContent = JSON.stringify(detailPayload, null, 2);
						els.networkWarningDetails.hidden = false;
						els.networkWarningDetails.open = false;
					} else {
						els.networkWarningJson.textContent = "";
						els.networkWarningDetails.hidden = true;
						els.networkWarningDetails.open = false;
					}
				}

				function renderNetworkWarningNonCnRow(family, info) {
					const ip = info && info.ip ? info.ip : "未获取";
					const country = info && info.country ? String(info.country).toUpperCase() : "未知";
					return `<div class="network-warning-row">
						<span class="network-warning-family">${escapeHtml(family.toUpperCase())}</span>
						<span class="network-warning-ip">${escapeHtml(ip)}</span>
						<span class="network-warning-country">地区代码 ${escapeHtml(country)}</span>
					</div>`;
				}

				function renderNetworkWarningFailedRow(family, info) {
					const error = info && info.error ? info.error : "请求失败";
					return `<div class="network-warning-row">
						<span class="network-warning-family">${escapeHtml(family.toUpperCase())}</span>
						<span class="network-warning-ip">${escapeHtml(error)}</span>
						<span class="network-warning-country">失败</span>
					</div>`;
				}

				function confirmNetworkWarning() {
					if (window.parent && window.parent !== window) {
						try {
							window.parent.location.reload();
							return;
						} catch (error) {
							// Fall back to postMessage below when direct parent access is unavailable.
						}

						try {
							window.parent.postMessage({ type: "bestcf-force-reload" }, "*");
							return;
						} catch (error) {
							// Ignore and reload the current document as a last resort.
						}
					}

					window.location.reload();
				}

				function openLocalOptimizeFromWarning() {
					// 关闭当前警告弹窗
					els.networkWarningOverlay.classList.remove("is-visible");

					if (window.parent && window.parent !== window) {
						try {
							if (typeof window.parent.switchToLocalOptimizeFromOnline === "function") {
								window.parent.switchToLocalOptimizeFromOnline();
								return;
							}
						} catch (error) {
							// Fall back to postMessage below when direct parent access is unavailable.
						}

						try {
							window.parent.postMessage({ type: "bestcf-open-local-optimize" }, "*");
							return;
						} catch (error) {
							// Ignore — nothing else we can do from inside the frame.
						}
					}
				}

				async function detectStack(family, host) {
					const { endpoint, data } = await fetchJsonFromFastestEndpoint(buildDetectEndpoints(family, host), "ip.json", 6500);
					const allowed = data.country === "CN";
					return {
						status: "done",
						allowed,
						endpoint,
						ip: data.ip || "",
						ipType: data.ipType || family,
						country: data.country || "未知",
						cnIspCode: data.cnIspCode || "",
						preferredType: preferredTypeFromCnIspCode(data.cnIspCode),
						colo: data.colo || "",
						asn: data.asn || "",
						raw: data
					};
				}

				async function loadLocations() {
					const endpoints = [];
					if (state.ipv4 && state.network.ipv4 && state.network.ipv4.endpoint) endpoints.push(state.network.ipv4.endpoint);
					if (state.ipv6 && state.network.ipv6 && state.network.ipv6.endpoint) endpoints.push(state.network.ipv6.endpoint);

					try {
						const { data: locations } = await fetchJsonFromFastestEndpoint([...new Set(endpoints)], "locations", 8000);
						if (!Array.isArray(locations)) throw new Error("locations 响应格式无效");
						state.locations = locations;
						state.locationsByIata = new Map(
							locations
								.filter((item) => item && item.iata)
								.map((item) => [String(item.iata).toUpperCase(), item])
						);
					} catch (error) {
						state.locations = [];
						state.locationsByIata = new Map();
					}
				}

				function renderNetworkCard(family, info) {
					const card = family === "ipv4" ? els.ipv4Card : els.ipv6Card;
					const value = family === "ipv4" ? els.ipv4Value : els.ipv6Value;
					const tag = family === "ipv4" ? els.ipv4Tag : els.ipv6Tag;
					const note = card.querySelector(".network-note");
					card.classList.remove("is-loading", "is-ok", "is-failed", "is-unavailable");

					if (!info || info.status === "loading") {
						card.classList.remove("is-hidden");
						card.classList.add("is-loading");
						value.textContent = "检测中";
						if (note) note.textContent = "识别线路";
						tag.className = "tag idle";
						tag.textContent = "等待";
						return;
					}

					if (info.status === "failed") {
						card.classList.remove("is-hidden");
						card.classList.add("is-failed");
						value.textContent = "不具备优选条件";
						if (note) note.textContent = "线路不可用";
						tag.className = "tag bad";
						tag.textContent = "未就绪";
						return;
					}

					if (!info.allowed) {
						card.classList.add("is-hidden");
						card.classList.add("is-unavailable");
						value.textContent = "不可用";
						if (note) note.textContent = "非CN网络";
						tag.className = "tag bad";
						tag.textContent = info.country || "非CN";
						return;
					}

					card.classList.remove("is-hidden");
					card.classList.add("is-ok");
					value.textContent = maskIpForDisplay(info.ip, info.ipType || family);
					if (note) note.textContent = info.preferredType || preferredTypeFromCnIspCode(info.cnIspCode);
					tag.className = "tag ok";
					tag.textContent = `${info.country || "未知"} · ${String(info.cnIspCode || "unknown").toUpperCase()}`;
				}

				function maskIpForDisplay(ip, family) {
					if (!ip) return "未获取";
					if (family === "ipv6") return maskIpv6ForDisplay(ip);
					return maskIpv4ForDisplay(ip);
				}

				function maskIpv4ForDisplay(ip) {
					const parts = ip.split(".");
					if (parts.length !== 4) return "已脱敏";
					return `${parts[0]}.***.**.${parts[3]}`;
				}

				function maskIpv6ForDisplay(ip) {
					const normalized = normalizeIpv6(ip);
					if (!normalized) return "已脱敏";
					const groups = expandIpv6Groups(normalized);
					if (!groups) return "已脱敏";
					return `${groups[0]}:****:****:${groups[7]}`;
				}

				function updateServiceStatus() {
					const available = availableFamilies();
					if (available.length === 0) {
						els.latencyStatus.textContent = "网络不可用";
						return;
					}

					els.latencyStatus.textContent = "等待优选";
				}

				function availableFamilies() {
					const list = [];
					if (state.ipv4) list.push("ipv4");
					if (state.ipv6) list.push("ipv6");
					return list;
				}

				function librarySelectionKey(source) {
					if (!source) return "";
					const family = source.family || (source.dataset && source.dataset.family) || "";
					const url = source.url || (source.dataset && source.dataset.url) || "";
					return family && url ? `${family}|${url}` : "";
				}

				function readCachedLibraryKey() {
					try {
						return window.localStorage.getItem(LIBRARY_SELECTION_CACHE_KEY) || "";
					} catch (error) {
						return "";
					}
				}

				function cacheLibraryKey(key) {
					if (!key) return;
					state.preferredLibraryKey = key;
					try {
						window.localStorage.setItem(LIBRARY_SELECTION_CACHE_KEY, key);
					} catch (error) {
						// Some embedded contexts can deny storage; in-memory restore still works.
					}
				}

				function rememberSelectedLibrary() {
					const key = librarySelectionKey(els.librarySelect.selectedOptions[0]);
					if (key) cacheLibraryKey(key);
				}

				function preferredLibraryKey() {
					const currentKey = librarySelectionKey(els.librarySelect.selectedOptions[0]);
					return currentKey || state.preferredLibraryKey || readCachedLibraryKey();
				}

				function updateLibraryOptions() {
					const selectedKey = preferredLibraryKey();
					const families = new Set(availableFamilies());
					const options = IP_LIBRARIES.filter((item) => families.has(item.family));
					els.librarySelect.innerHTML = "";
					if (!options.length) {
						const option = document.createElement("option");
						option.textContent = "无可用IP库";
						option.value = "";
						els.librarySelect.appendChild(option);
						els.librarySelect.disabled = true;
						els.importBtn.disabled = true;
						return;
					}

					options.forEach((item) => {
						const key = librarySelectionKey(item);
						const option = document.createElement("option");
						option.value = key;
						option.textContent = item.label;
						option.dataset.url = item.url;
						option.dataset.family = item.family;
						option.dataset.libraryKey = key;
						els.librarySelect.appendChild(option);
					});

					const restoredOption = selectedKey
						? Array.from(els.librarySelect.options).find((option) => option.dataset.libraryKey === selectedKey)
						: null;
					if (restoredOption) {
						els.librarySelect.value = restoredOption.value;
						state.preferredLibraryKey = selectedKey;
					}

					els.librarySelect.disabled = false;
					els.importBtn.disabled = false;
				}

				function updateActionAvailability() {
					const hasService = availableFamilies().length > 0;
					const latencyActive = Boolean(state.latencyRun);
					const speedActive = Boolean(state.speedRun);
					els.latencyBtn.disabled = state.networkChecking || speedActive || (!hasService && !latencyActive);
					if (els.speedAllBtn) {
						els.speedAllBtn.disabled = state.networkChecking ||
							latencyActive ||
							(!hasService && !speedActive) ||
							(state.results.length === 0 && !speedActive);

				async function testLatency(address, timeout, run) {
					const parsed = parseAddressWithPort(address);
					if (!parsed) throw new Error("地址格式无效");
					const url = buildProbeUrl(parsed, "ip.json");

					await testOptionsConnectivity(url, timeout * 2, run);

					const started = performance.now();
					const response = await fetchWithTimeout(url, { method: "GET", timeout, run });
					if (!response.ok) throw new Error("GET 不可用");
					const data = await response.json();
					const latency = Math.max(1, Math.round(performance.now() - started));
					if (latency > timeout) throw new Error("延迟超过超时时间");
					const official = isOfficialPreferredIp(data);
					const responseIpType = data.ipType || "";
					const type = official ? officialPreferredType(data) : "优选反代";
					const country = official ? countryFromColo(data.colo) : (data.country || "未知");

					return {
						address,
						parsed,
						type,
						country,
						latency,
						speedState: "pending",
						speedMbps: null,
						ipType: responseIpType,
						responseIp: data.ip || "",
						colo: data.colo || "",
						raw: data
					};
				}

				function isOfficialPreferredIp(data) {
					if (data.ip && (data.ip === state.ipv4 || data.ip === state.ipv6)) return true;
					const country = String(data.country || "").toUpperCase();
					const cnIspCode = String(data.cnIspCode || "").toLowerCase();
					return country === "CN" && cnIspCode !== "other";
				}

				function officialPreferredType(data) {
					const family = officialResultFamily(data);
					const info = networkInfoByIpType(family);
					if (info && info.preferredType) return info.preferredType;

					const cnIspCode = normalizeCnIspCode(info && info.cnIspCode) || displayedCnIspCode(family);
					return preferredTypeFromCnIspCode(cnIspCode);
				}

				function preferredTypeFromCnIspCode(cnIspCode) {
					const normalizedCode = normalizeCnIspCode(cnIspCode);
					const typeMap = {
						ct: "电信优选",
						cu: "联通优选",
						cmcc: "移动优选"
					};
					return typeMap[normalizedCode] || "官方优选";
				}

				function officialResultFamily(data) {
					if (data && data.ip) {
						if (data.ip === state.ipv4) return "ipv4";
						if (data.ip === state.ipv6) return "ipv6";
					}

					return String(data && data.ipType ? data.ipType : "").toLowerCase();
				}

				function networkInfoByIpType(family) {
					if (family === "ipv4" || family === "ipv6") {
						const direct = state.network[family];
						if (direct && String(direct.ipType || "").toLowerCase() === family) return direct;

						const matched = Object.values(state.network).find((info) =>
							info && String(info.ipType || "").toLowerCase() === family
						);
						if (matched) return matched;

						return direct || null;
					}

					return null;
				}

				function normalizeCnIspCode(value) {
					return String(value || "").trim().toLowerCase();
				}

				function displayedCnIspCode(family) {
					const tag = family === "ipv4" ? els.ipv4Tag : (family === "ipv6" ? els.ipv6Tag : null);
					const text = tag ? String(tag.textContent || "") : "";
					const parts = text.split("·");
					return normalizeCnIspCode(parts.length > 1 ? parts[1] : "");
				}

				async function testOptionsConnectivity(url, timeout, run) {
					let lastError = null;
					for (let attempt = 0; attempt < 3; attempt += 1) {
						if (run && run.stopped) throw new Error("已停止");
						try {
							const response = await fetchWithTimeout(url, { method: "OPTIONS", timeout, run });
							if (response.ok) return;
							lastError = new Error(`OPTIONS HTTP ${response.status}`);
						} catch (error) {
							lastError = error;
							if (run && run.stopped) throw error;
						}
					}
					throw lastError || new Error("OPTIONS 不可用");
				}

				function countryFromColo(colo) {
					if (!colo) return "未知";
					const match = state.locationsByIata.get(String(colo).toUpperCase());
					return match && match.cca2 ? match.cca2 : "未知";
				}

				async function testDownloadSpeed(parsed, run, onProgress) {
					const url = buildProbeUrl(parsed, "__down", { bytes: "20000000" });
					const controller = new AbortController();
					const maxDuration = 10000;
					let timedOut = false;
					let totalBytes = 0;
					let started = 0;
					let lastRemaining = 10;
					let ticker = null;
					const timeout = window.setTimeout(() => {
						timedOut = true;
						controller.abort();
					}, maxDuration);
					if (run) {
						run.controllers.add(controller);
						if (run.stopped) controller.abort();
					}

					const finishSpeed = () => {
						const elapsed = Math.max(1, performance.now() - started);
						return totalBytes > 0 ? (totalBytes * 8) / (elapsed / 1000) / 1000000 : 0;
					};
					const reportProgress = () => {
						const elapsed = performance.now() - started;
						const remaining = Math.max(0, Math.ceil((maxDuration - elapsed) / 1000));
						const speedMbps = finishSpeed();
						if (remaining !== lastRemaining) {
							lastRemaining = remaining;
							if (typeof onProgress === "function") onProgress({ remaining, speedMbps });
							return;
						}
						if (typeof onProgress === "function") onProgress({ remaining, speedMbps });
					};

					try {
						started = performance.now();
						if (typeof onProgress === "function") onProgress({ remaining: 10, speedMbps: 0 });
						ticker = window.setInterval(reportProgress, 250);
						const response = await fetch(url, {
							method: "GET",
							cache: "no-store",
							signal: controller.signal
						});
						if (!response.ok) throw new Error("下载失败");

						if (!response.body || !response.body.getReader) {
							const buffer = await response.arrayBuffer();
							totalBytes = buffer.byteLength;
							if (typeof onProgress === "function") onProgress({ remaining: 0, speedMbps: finishSpeed() });
							return finishSpeed();
						}

						const reader = response.body.getReader();

						while (true) {
							if (performance.now() - started >= maxDuration) {
								timedOut = true;
								controller.abort();
								break;
							}
							const { done, value } = await reader.read();
							if (done) break;
							const size = value.byteLength || value.length || 0;
							totalBytes += size;
							reportProgress();
						}

						if (typeof onProgress === "function") onProgress({ remaining: 0, speedMbps: finishSpeed() });
						return finishSpeed();
					} catch (error) {
						if (timedOut && totalBytes > 0) {
							if (typeof onProgress === "function") onProgress({ remaining: 0, speedMbps: finishSpeed() });
							return finishSpeed();
						}
						throw error;
					} finally {
						window.clearTimeout(timeout);
						if (ticker) window.clearInterval(ticker);
						if (run) run.controllers.delete(controller);
					}
				}
